name: Publish Preview Package

on:
  push:
    branches:
      - fix/sti-child-relation-scoping-0.3.13

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run compile

      - run: npx pkg-pr-new publish --publicize
